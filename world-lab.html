<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Lab — Oathbound Tactics</title>
    <style>
      :root { color-scheme: dark; --bg: #16181d; --panel: #20232b; --line: #343846; --text: #e6e6ea; --dim: #9aa0ae; --accent: #e3b341; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 12px; overflow: auto; }
      aside h1 { font-size: 15px; margin: 0 0 8px; }
      aside label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; color: var(--dim); }
      select, button, input { background: #2b2f3a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: inherit; }
      input[type=number] { width: 80px; }
      button.on { border-color: var(--accent); color: var(--accent); }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      #mini { width: 266px; height: 266px; image-rendering: pixelated; border: 1px solid var(--line); cursor: crosshair; margin-top: 6px; }
      #info { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
      #stage { position: relative; overflow: hidden; }
      #host { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #hover { position: absolute; right: 8px; bottom: 8px; background: #000a; padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <h1>World Lab</h1>
        <label>Seed <input id="seed" type="number" value="1337" /></label>
        <label>Set piece <select id="sp"></select></label>
        <label>KMU x,y <span><input id="kx" type="number" value="500" style="width:60px" /> <input id="ky" type="number" value="700" style="width:60px" /></span></label>
        <div class="row"><button id="go">Go to KMU</button><button id="regen">Regenerate</button></div>
        <label>View size (tiles) <input id="size" type="number" value="64" min="15" max="200" /></label>
        <label>Scale <select id="scale"><option>0.35</option><option>0.5</option><option selected>0.75</option><option>1</option><option>1.5</option><option>2</option></select></label>
        <div class="row"><button id="rotl">⟲ Rotate</button><button id="rotr">Rotate ⟳</button><button id="carve">Carve 15×15 battle</button></div>
        <div class="row"><button data-pan="n">▲</button><button data-pan="w">◀</button><button data-pan="e">▶</button><button data-pan="s">▼</button></div>
        <canvas id="mini" width="266" height="266"></canvas>
        <div id="info"></div>
      </aside>
      <main id="stage"><div id="host"></div><div id="hover"></div></main>
    </div>
    <script type="module" src="/src/labs/world-lab.ts"></script>
  </body>
</html>
